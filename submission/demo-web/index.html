<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenMerge — Trải nghiệm Giao diện Điện thoại & Trang Quản trị</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --fg: #0f172a;
      --muted: #475569;
      --primary: #15803d;
      --primary-fg: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }
    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 11px;
      background: linear-gradient(135deg, #15803d, #0284c7);
      color: #fff; font-weight: 800; font-size: 14px;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 800; line-height: 1.2; }
    .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .tab-group {
      display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px;
      border-radius: 12px; background: var(--bg); border: 1px solid var(--border);
    }
    .btn {
      border: 1px solid transparent; background: transparent; color: var(--fg);
      padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: opacity 0.15s ease;
    }
    .btn:hover { opacity: 0.88; }
    .btn-outline { background: var(--card); border-color: var(--border); }
    .btn-active { background: var(--primary) !important; color: var(--primary-fg) !important; border-color: var(--primary) !important; }
    .main { max-width: 1440px; margin: 0 auto; padding: 20px; }
    .subbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 16px; font-size: 12.5px; color: var(--muted);
    }
    .subbar-center { justify-content: center; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .hidden { display: none !important; }

    .hero-stage {
      border-radius: 20px;
      padding: 26px;
      background: linear-gradient(135deg, #ecfdf5 0%, #f0f9ff 100%);
      border: 1px solid #cbd5e1;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
      gap: 28px;
    }
    .hero-phone-col { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .hero-web-col { flex: 1 1 680px; min-width: 300px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .pill-cap {
      font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 999px;
      background: #fff; border: 1px solid #bbf7d0; color: #14532d;
    }
    .pill-cap.blue { border-color: #bae6fd; color: #0369a1; }

    .phone-frame {
      width: 380px; max-width: 100%; border-radius: 42px; background: #0f172a; padding: 11px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25);
    }
    .phone-screen {
      background: #f4f7fb; color: #0f172a; border-radius: 32px; overflow: hidden;
      height: 760px; display: flex; flex-direction: column;
    }
    .phone-notch { width: 108px; height: 22px; background: #0f172a; border-radius: 999px; margin: 7px auto 0; }
    .phone-scroll { flex: 1; overflow-y: auto; padding: 12px 13px 20px; scrollbar-width: thin; }

    .browser-frame {
      width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid #cbd5e1;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.14);
    }
    .web-light {
      --w-bg: #f4f7fb; --w-surface: #ffffff; --w-alt: #f8fafc; --w-ink: #0f172a;
      --w-muted: #475569; --w-subtle: #64748b; --w-border: #e2e8f0;
      --w-primary: #0284c7; --w-primary-dark: #0369a1; --w-primary-soft: #e0f2fe;
      --w-success: #15803d; --w-success-soft: #dcfce7;
      --w-warn: #b45309; --w-warn-soft: #fef3c7;
      --w-danger: #b91c1c; --w-danger-soft: #fee2e2;
    }
    .web-dark {
      --w-bg: #0b1120; --w-surface: #111827; --w-alt: #1e293b; --w-ink: #f8fafc;
      --w-muted: #cbd5e1; --w-subtle: #94a3b8; --w-border: #263244;
      --w-primary: #38bdf8; --w-primary-dark: #7dd3fc; --w-primary-soft: rgba(56,189,248,0.15);
      --w-success: #4ade80; --w-success-soft: rgba(74,222,128,0.15);
      --w-warn: #fbbf24; --w-warn-soft: rgba(251,191,36,0.16);
      --w-danger: #f87171; --w-danger-soft: rgba(248,113,113,0.16);
    }
    .web-body { background: var(--w-bg); color: var(--w-ink); padding-bottom: 18px; }
    .web-card { background: var(--w-surface); border: 1px solid var(--w-border); }
    .web-alt { background: var(--w-alt); border: 1px solid var(--w-border); }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .web-split { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, 1fr); gap: 12px; align-items: start; }
    @media (max-width: 900px) { .web-split { grid-template-columns: 1fr; } }
    .hotspot-grid {
      background:
        radial-gradient(circle at 22% 28%, rgba(2,132,199,0.12), transparent 45%),
        radial-gradient(circle at 72% 64%, rgba(21,128,61,0.12), transparent 40%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, var(--w-border) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, var(--w-border) 40px),
        var(--w-alt);
    }
    .mobile-stage { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; padding: 6px 0; }
    .capture-clean .toolbar-chrome { display: none !important; }
    .capture-exit {
      display: none; position: fixed; bottom: 16px; right: 16px; z-index: 50;
      padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid #cbd5e1;
      font-size: 12px; font-weight: 700; box-shadow: 0 8px 24px rgba(15,23,42,0.16); cursor: pointer;
    }
    .capture-clean .capture-exit { display: inline-flex !important; }
  </style>
</head>

  <header class="topbar toolbar-chrome">

      <div class="brand">
        <div class="brand-logo">GM</div>
        <div>
          <h1>GreenMerge — Giao diện Điện thoại &amp; Trang Quản trị</h1>

        </div>
      </div>
      <div class="controls">
        <div class="tab-group">
          <button id="mode-both" class="btn" onclick="setMode('both')">📱+💻 Xem song song</button>
          <button id="mode-mobile" class="btn" onclick="setMode('mobile')">📱 Điện thoại (6 màn hình)</button>
          <button id="mode-web" class="btn" onclick="setMode('web')">💻 Web Ban quản lý (3 tab)</button>
        </div>
        <button class="btn btn-outline" onclick="toggleCleanMode()">📸 Chế độ chụp sạch</button>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- BOTH -->
    <section id="view-both">
      <div class="subbar toolbar-chrome">
        <span>Chọn cặp giao diện để trải nghiệm tương tác hoặc chụp màn hình đưa vào Slide:</span>
        <div class="btn-row">
          <button id="preset-tier1" class="btn btn-outline" onclick="setPairPreset('tier1')">Cặp 1: Tầng 1 (Gom trùng AI + Bản đồ)</button>
          <button id="preset-tier2" class="btn btn-outline" onclick="setPairPreset('tier2')">Cặp 2: Tầng 2 (Tình nguyện Xanh + Duyệt Trước–Sau)</button>
          <button id="preset-cert" class="btn btn-outline" onclick="setPairPreset('cert')">Cặp 3: Trang chủ + Bảng KPI &amp; Phát động</button>
        </div>
      </div>
      <div class="hero-stage">
        <div class="hero-phone-col">
          <div id="both-phone-host"></div>
          <span id="both-phone-caption" class="pill-cap">📱 Ứng dụng Điện thoại</span>
        </div>
        <div class="hero-web-col">
          <div id="both-web-host" style="width:100%;"></div>
          <span id="both-web-caption" class="pill-cap blue">💻 Trang Quản trị Ban quản lý</span>
        </div>
      </div>
    </section>

    <!-- MOBILE ONLY -->
    <section id="view-mobile" class="hidden">
      <div class="subbar subbar-center toolbar-chrome">
        <div class="btn-row">
          <button data-ps="home" class="btn btn-outline ps-btn" onclick="selectPhoneScreen('home')">1. Trang chủ</button>
          <button data-ps="report" class="btn btn-outline ps-btn" onclick="selectPhoneScreen('report')">2. Chụp báo cáo &amp; GPS</button>
          <button data-ps="result" class="btn btn-outline ps-btn" onclick="selectPhoneScreen('result')">3. Kết quả AI &amp; Gộp 2 ảnh</button>
          <button data-ps="detail" class="btn btn-outline ps-btn" onclick="selectPhoneScreen('detail')">4. Chi tiết hồ sơ</button>
          <button data-ps="volunteer" class="btn btn-outline ps-btn" onclick="selectPhoneScreen('volunteer')">5. Buổi Tình Nguyện Xanh</button>
          <button data-ps="cert" class="btn btn-outline ps-btn" onclick="selectPhoneScreen('cert')">6. Giấy Chứng Nhận Xanh</button>
          <button data-ps="gallery" class="btn btn-outline ps-btn" onclick="selectPhoneScreen('gallery')">✨ Xem 3 màn hình cùng lúc</button>
        </div>
      </div>
      <div id="mobile-stage" class="mobile-stage"></div>
    </section>

    <!-- WEB ONLY -->
    <section id="view-web" class="hidden">
      <div class="subbar toolbar-chrome">
        <div class="btn-row">
          <button data-wt="list" class="btn btn-outline wt-btn" onclick="selectWebTab('list')">1. Danh sách ưu tiên &amp; Phát động</button>
          <button data-wt="map" class="btn btn-outline wt-btn" onclick="selectWebTab('map')">2. Bản đồ điểm nóng GPS</button>
          <button data-wt="volunteer" class="btn btn-outline wt-btn" onclick="selectWebTab('volunteer')">3. 🌿 Duyệt Tình nguyện Xanh (Trước–Sau)</button>
        </div>
        <button id="btn-web-theme" class="btn btn-outline" onclick="toggleWebTheme()">🌙 Chuyển giao diện Tối</button>
      </div>
      <div id="web-stage"></div>
    </section>
  </main>

        </div>
        <img src="${PHOTOS.trashBefore}" style="width:100%; height:132px; object-fit:cover; border-radius:10px; border:1px solid var(--w-border); margin-bottom:10px;" />
        <div class="web-alt" style="border-radius:10px; padding:9px 11px; font-size:11.5px; margin-bottom:10px;">
          <div><b>Đơn vị phụ trách:</b> Tổ vệ sinh KTX (Phân vùng tự động)</div>
          <div style="margin-top:3px;"><b>Địa chỉ:</b> Lối đi sau Ký túc xá B, ĐH Công nghiệp Hà Nội</div>
        </div>
        <div style="background:var(--w-success-soft); border:1.5px solid #22c55e; border-radius:11px; padding:10px 11px;">
          <div style="font-size:12px; font-weight:800; color:var(--w-success); margin-bottom:4px;">🌿 Lựa chọn phát động Buổi Tình Nguyện Xanh</div>
          <div style="font-size:11px; color:var(--w-muted); margin-bottom:8px;">Sự cố rác thải cơ bản, an toàn cho sinh viên. Phát động buổi dọn giúp tiết kiệm chi phí vệ sinh ngoài giờ.</div>
          <div style="background:#15803d; color:#fff; text-align:center; padding:8px; border-radius:9px; font-size:12px; font-weight:800;">🚀 Phát động Buổi Tình Nguyện Xanh (Mở đăng ký)</div>
        </div>
      `;
    }

    function setMode(mode) {
      currentMode = mode;
      ['both', 'mobile', 'web'].forEach(m => {
        document.getElementById('view-' + m).classList.toggle('hidden', m !== mode);
        document.getElementById('mode-' + m).classList.toggle('btn-active', m === mode);
      });
      renderCurrent();
    }
    function setPairPreset(preset) {
      currentPair = preset;
      ['tier1', 'tier2', 'cert'].forEach(p => {
        document.getElementById('preset-' + p).classList.toggle('btn-active', p === preset);
      });
      renderBoth();
    }
    function selectPhoneScreen(sc) {
      currentPhoneScreen = sc;
      document.querySelectorAll('.ps-btn').forEach(b => b.classList.toggle('btn-active', b.dataset.ps === sc));
      renderMobile();
    }
    function selectWebTab(tab) {
      currentWebTab = tab;
      document.querySelectorAll('.wt-btn').forEach(b => b.classList.toggle('btn-active', b.dataset.wt === tab));
      renderWeb();
    }
    function switchWebTabInline(tab) {
      currentWebTab = tab;
      if (currentMode === 'web') selectWebTab(tab);
      else renderBoth(tab);
    }
    function toggleWebTheme() {
      webDark = !webDark;
      document.getElementById('btn-web-theme').textContent = webDark ? '☀️ Chuyển giao diện Sáng' : '🌙 Chuyển giao diện Tối';
      renderCurrent();
    }
    function toggleCleanMode() { document.body.classList.toggle('capture-clean'); }

    function renderBoth(overrideWebTab) {
      const cfg = {
        tier1: { phone: 'result', web: 'map', pCap: '📱 Điện thoại · AI phân tích & Đối chiếu gộp 2 ảnh', wCap: '💻 Trang Quản trị · Bản đồ điểm nóng GPS' },
        tier2: { phone: 'volunteer', web: 'volunteer', pCap: '📱 Điện thoại · Buổi Tình Nguyện Xanh & Ảnh Trước–Sau', wCap: '💻 Trang Quản trị · Đối chiếu Trước–Sau & Cấp chứng nhận' },
        cert: { phone: 'home', web: 'list', pCap: '📱 Điện thoại · Trang chủ Cộng đồng Xanh', wCap: '💻 Trang Quản trị · 5 chỉ số KPI & Phát động TNV' },
      }[currentPair];
      document.getElementById('both-phone-host').innerHTML = renderPhoneFrame(cfg.phone);
      document.getElementById('both-web-host').innerHTML = renderWebAdmin(overrideWebTab || cfg.web);
      document.getElementById('both-phone-caption').textContent = cfg.pCap;
      document.getElementById('both-web-caption').textContent = cfg.wCap;
    }
    function renderMobile() {
      const host = document.getElementById('mobile-stage');
      if (currentPhoneScreen === 'gallery') {
        host.innerHTML = ['home', 'result', 'volunteer'].map(k => renderPhoneFrame(k)).join('');
      } else {
        host.innerHTML = renderPhoneFrame(currentPhoneScreen);
      }
    }
    function renderWeb() {
      document.getElementById('web-stage').innerHTML = renderWebAdmin(currentWebTab);
    }
    function renderCurrent() {
      if (currentMode === 'both') renderBoth();
      else if (currentMode === 'mobile') renderMobile();
      else renderWeb();
    }

    setPairPreset('tier2');
    selectPhoneScreen('home');
    selectWebTab('volunteer');
    setMode('both');
  </script>
</body>
</html>
